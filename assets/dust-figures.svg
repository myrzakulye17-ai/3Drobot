<svg xmlns="http://www.w3.org/2000/svg" width="650" height="464" viewBox="0 0 650 464" role="img" aria-labelledby="title desc">
<title id="title">Dust and salt in numbers</title><desc id="desc">Approximately 100 million tonnes of dust and salt from the Aralkum enter the atmosphere annually. Documented on four continents. Illustrative rising bars for the 1980s through 2020s.</desc>
<defs><linearGradient id="bar" x2="0" y2="1"><stop stop-color="#cc972d"/><stop offset="1" stop-color="#b84a29"/></linearGradient></defs><rect width="650" height="464" fill="white"/>
<g font-family="Arial, sans-serif" fill="#625a52"><text x="30" y="50" font-family="monospace" font-size="15">DUST AND SALT IN NUMBERS</text><text x="625" y="50" text-anchor="end">···</text><text x="30" y="129" font-family="monospace" font-size="48" font-weight="bold" fill="#29251f">~100</text><text x="159" y="128" font-size="24" font-weight="bold" fill="#b94d2a">million tonnes</text><text x="30" y="164" font-size="15">of Aralkum dust and salt enter the air each year</text>
<rect x="30" y="302" width="30" height="34" rx="2" fill="url(#bar)"/><text x="45" y="359" font-family="monospace" font-size="12" text-anchor="middle">1980s</text><rect x="77" y="282" width="30" height="54" rx="2" fill="url(#bar)"/><text x="92" y="359" font-family="monospace" font-size="12" text-anchor="middle">1990s</text><rect x="124" y="264" width="30" height="72" rx="2" fill="url(#bar)"/><text x="139" y="359" font-family="monospace" font-size="12" text-anchor="middle">2000s</text><rect x="171" y="239" width="30" height="97" rx="2" fill="url(#bar)"/><text x="186" y="359" font-family="monospace" font-size="12" text-anchor="middle">2010s</text><rect x="218" y="197" width="30" height="139" rx="2" fill="url(#bar)"/><text x="233" y="359" font-family="monospace" font-size="12" text-anchor="middle">2020s</text>
<path d="M30 387H630" stroke="#d9d5d0"/><circle cx="45" cy="422" r="14" fill="#1e4c4d"/><circle cx="75" cy="422" r="14" fill="#b94b28"/><circle cx="105" cy="422" r="14" fill="#c7952b"/><text x="139" y="427" font-size="15">Documented on 4 continents</text></g></svg>