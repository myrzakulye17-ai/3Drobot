<script>
(function(){
const PARTS = {

function rng(seed){return function(){seed|=0;seed=seed+0x6D2B79F5|0;let t=Math.imul(seed^seed>>>15,1|seed);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}

const scene = new THREE.Scene();
scene.background = canvasTex(4,256,(g,w,h)=>{const gr=g.createLinearGradient(0,0,0,h);gr.addColorStop(0,'#86AFBE');gr.addColorStop(.55,'#C9D3CC');gr.addColorStop(1,'#EBDDBF');g.fillStyle=gr;g.fillRect(0,0,w,h)});
scene.fog = new THREE.Fog(0xE6D7B8, 14, 46);

const camera = new THREE.PerspectiveCamera(38, window.innerWidth/window.innerHeight, 0.03, 200);
camera.position.set(3.6,2.3,4.4);
const controls = new THREE.OrbitControls(camera, renderer.domElement);
controls.enableDamping = true; controls.dampingFactor = .08;

controls.maxPolarAngle = Math.PI*0.495;
controls.target.set(1.2,.35,0);

scene.add(new THREE.HemisphereLight(0xFFF3DD, 0xB08A5A, .7));
const sun = new THREE.DirectionalLight(0xFFF0D2, 1.55);
sun.position.set(5,9,4.5); sun.castShadow = true;
sun.shadow.mapSize.set(2048,2048);
Object.assign(sun.shadow.camera,{left:-5,right:8,top:5,bottom:-5,near:1,far:30});

function flatMask(x,z){const dx=Math.max(0,-3.2-x,x-8.5),dz=Math.max(0,Math.abs(z)-1.4);return Math.hypot(dx,dz);}

  const d=flatMask(x,z);

  const ripple=smooth(0,1.5,d)*0.018*Math.sin(x*6.5+z*2.6);
  return Math.max(0,dunes*1.5)+ripple;

const sandTex = canvasTex(256,256,(g,w,h)=>{g.fillStyle='#D2B98D';g.fillRect(0,0,w,h);for(let i=0;i&lt;5200;i++){const v=R();g.fillStyle=v&lt;.5?'rgba(150,118,78,'+(.08+R()*.14)+')':'rgba(255,248,230,'+(.08+R()*.18)+')';g.fillRect(R()*w,R()*h,1+R()*1.5,1+R()*1.5)}});

}

  orange: std(0xE07A35,{roughness:.55}),

};

const robot = new THREE.Group(); scene.add(robot);
const parts = {};
function part(name){const g=new THREE.Group();g.userData.base=new THREE.Vector3();robot.add(g);parts[name]=g;return g;}

const shp = new THREE.Shape();
shp.moveTo(-.45,.12); shp.lineTo(.42,.12); shp.lineTo(.47,.17); shp.lineTo(.47,.2); shp.lineTo(.22,.36); shp.lineTo(-.33,.36);
shp.quadraticCurveTo(-.45,.36,-.45,.29); shp.lineTo(-.45,.12);
const hullGeo = new THREE.ExtrudeGeometry(shp,{depth:.42,bevelEnabled:true,bevelThickness:.012,bevelSize:.012,bevelSegments:3,curveSegments:10});

[-1,1].forEach(s=>{

const slope = Math.atan2(.16,.25);
const ledBar = mesh(new THREE.BoxGeometry(.035,.008,.3),M.led,hullG,.40,.255,0); ledBar.rotation.z=-slope;

const innerG = part('inner');
mesh(cylX(.09,.34,32),M.orange,innerG,-.03,.235,0);
mesh(cylX(.092,.012,32),M.hull,innerG,-.2,.235,0); mesh(cylX(.092,.012,32),M.hull,innerG,.14,.235,0);
mesh(new THREE.BoxGeometry(.14,.08,.3),M.dark,innerG,.27,.2,0);

mesh(new THREE.CylinderGeometry(.025,.025,.05,16),M.metal,innerG,-.13,.16,.06);
const hose = new THREE.CatmullRomCurve3([new THREE.Vector3(-.05,.145,.04),new THREE.Vector3(-.13,.15,.06),new THREE.Vector3(-.12,.125,.02),new THREE.Vector3(-.12,.11,0)]);

const TL=.78, TR=.1, TRC=TR-.007, TP=2*TL+2*Math.PI*TRC, NCLEAT=60;
const cleatGeo = new THREE.BoxGeometry(.03,.014,.14);
const tracks=[]; const wheels=[];
[-1,1].forEach(s=>{
  const tg = part(s&lt;0?'trackL':'trackR'); tg.position.z=s*.3; tg.userData.base.set(0,0,s*.3);
  const inst = new THREE.InstancedMesh(cleatGeo,M.rubber,NCLEAT); inst.castShadow=true; inst.receiveShadow=true; inst.frustumCulled=false; tg.add(inst); tracks.push(inst);
  [-TL/2,TL/2].forEach(x=>{const w=mesh(cylZ(.084,.11,24),M.dark,tg,x,TR,0);wheels.push({m:w,r:.084});mesh(cylZ(.03,.115,16),M.orange,tg,x,TR,0)});
  [-.2,0,.2].forEach(x=>{const w=mesh(cylZ(.052,.1,20),M.dark,tg,x,.067,0);wheels.push({m:w,r:.052})});
  mesh(new THREE.BoxGeometry(.8,.07,.008),M.metal,tg,0,.105,-s*.058);
});
const tmpM=new THREE.Matrix4(), tmpQ=new THREE.Quaternion(), tmpE=new THREE.Euler(), tmpP=new THREE.Vector3(), oneS=new THREE.Vector3(1,1,1);
let trackOffset=0;
function trackPose(s){
  let x,y,a;
  if(s&lt;TL){x=TL/2-s;y=TR-TRC;a=0}
  else if(s&lt;TL+Math.PI*TRC){a=(s-TL)/TRC;x=-TL/2-TRC*Math.sin(a);y=TR-TRC*Math.cos(a)}
  else if(s&lt;2*TL+Math.PI*TRC){x=-TL/2+(s-TL-Math.PI*TRC);y=TR+TRC;a=Math.PI}
  else {a=(s-2*TL-Math.PI*TRC)/TRC;x=TL/2+TRC*Math.sin(a);y=TR+TRC*Math.cos(a);a=a+Math.PI}
  return [x,y,a];
}
function updateTracks(){
  tracks.forEach(inst=>{
    for(let i=0;i&lt;NCLEAT;i++){
      const s=(((i*TP/NCLEAT)+trackOffset)%TP+TP)%TP; const p=trackPose(s);
      tmpP.set(p[0],p[1],0); tmpQ.setFromEuler(tmpE.set(0,0,p[2])); tmpM.compose(tmpP,tmpQ,oneS); inst.setMatrixAt(i,tmpM);
    }
    inst.instanceMatrix.needsUpdate=true;
  });
}

const dripG = part('drip');

  const z=-.18+i*.06; const e=mesh(new THREE.ConeGeometry(.008,.02,12),M.orange,dripG,-.12,.078,z); e.rotation.x=Math.PI; emitters.push(e);

for(let i=0;i&lt;6;i++) mesh(cylZ(.0575,.008,32),M.dark,rollerSpin,0,0,-.17+i*.068);
[-1,1].forEach(s=>{const arm=mesh(new THREE.BoxGeometry(.13,.015,.01),M.dark,rollerG,-.29,.09,s*.205);arm.rotation.z=.55});

mesh(new THREE.CylinderGeometry(.05,.05,.012,28),M.teal,topG,-.03,.378,0);

mesh(new THREE.CylinderGeometry(.008,.008,.17,10),M.metal,topG,-.37,.457,.13);

mesh(cylX(.015,.03,16),M.copper,rearG,-.478,.27,0);

const EX = {hull:[0,.3,0], inner:[0,.1,0], top:[0,.5,0], trackL:[0,0,-.24], trackR:[0,0,.24], drip:[0,-.05,0], roller:[-.2,0,0], rear:[-.18,.05,0]};
robot.traverse(o=>{if(o.isMesh){o.castShadow=true;o.receiveShadow=true;}});

const dockG = new THREE.Group(); scene.add(dockG);
const concrete = std(0xBDB5A8,{roughness:.95});
mesh(new THREE.BoxGeometry(2.2,.02,2.4),concrete,dockG,-.3,-.008,.2);
[-1,1].forEach(s=>mesh(new THREE.BoxGeometry(1.1,.03,.03),M.dark,dockG,.05,.015,s*.43));
mesh(new THREE.BoxGeometry(.6,.8,1.0),M.hull,dockG,-.8,.4,0);
mesh(new THREE.BoxGeometry(.605,.06,1.005),M.teal,dockG,-.8,.62,0);
mesh(new THREE.BoxGeometry(.006,.42,.36),M.dark,dockG,-.497,.36,-.27);
const dockScreen = new THREE.MeshStandardMaterial({color:0x123533,emissive:0x3FB5A8,emissiveIntensity:.4});
mesh(new THREE.BoxGeometry(.006,.08,.14),dockScreen,dockG,-.496,.5,.27);
mesh(new THREE.BoxGeometry(.01,.11,.26),M.dark,dockG,-.502,.2,0);
[-.06,.06].forEach(z=>mesh(new THREE.BoxGeometry(.008,.032,.052),M.copper,dockG,-.494,.2,z));
mesh(cylX(.016,.04,16),M.copper,dockG,-.49,.27,0);
const dockLight = new THREE.MeshStandardMaterial({color:0xE8833A,emissive:0xE8833A,emissiveIntensity:.2});
mesh(new THREE.SphereGeometry(.025,16,12),dockLight,dockG,-.8,.84,.3);
mesh(new THREE.CylinderGeometry(.22,.22,.75,32),M.orange,dockG,-.8,.375,.85);
mesh(new THREE.CylinderGeometry(.08,.08,.04,20),M.dark,dockG,-.8,.77,.85);
mesh(cylZ(.02,.3,12),M.metal,dockG,-.75,.15,.55);
mesh(new THREE.CylinderGeometry(.008,.008,.35,8),M.metal,dockG,-1.0,.97,-.35);
mesh(new THREE.CylinderGeometry(.05,.05,.01,20),M.hull,dockG,-1.0,1.15,-.35).rotation.z=.6;
const tilt=.197, panelY=x=&gt;1.275-(x+.325)*Math.tan(tilt);
[[-1.2,-.75],[-1.2,.75],[.55,-.75],[.55,.75]].forEach(([x,z])=>{const h=panelY(x)-.03;mesh(new THREE.CylinderGeometry(.022,.022,h,12),M.metal,dockG,x,h/2,z)});
const solarTex = canvasTex(512,384,(g,w,h)=>{g.fillStyle='#16263D';g.fillRect(0,0,w,h);const cw=w/8,ch=h/6;for(let i=0;i&lt;8;i++)for(let j=0;j&lt;6;j++){const gr=g.createLinearGradient(i*cw,j*ch,i*cw+cw,j*ch+ch);gr.addColorStop(0,'#24406A');gr.addColorStop(1,'#1A2F50');g.fillStyle=gr;g.fillRect(i*cw+3,j*ch+3,cw-6,ch-6);g.strokeStyle='rgba(180,200,230,.18)';g.lineWidth=1;for(let k=1;k&lt;4;k++){g.beginPath();g.moveTo(i*cw+3,j*ch+k*ch/4);g.lineTo(i*cw+cw-3,j*ch+k*ch/4);g.stroke()}}});
const alu = std(0xC9CDCF,{roughness:.35,metalness:.7});
const panelMats=[alu,alu,std(0xffffff,{map:solarTex,roughness:.25,metalness:.35}),alu,alu,alu];
const panel = mesh(new THREE.BoxGeometry(1.95,.04,1.75),panelMats,dockG,-.325,1.275,0); panel.rotation.z=-tilt;
dockG.traverse(o=>{if(o.isMesh){o.castShadow=true;o.receiveShadow=true;}});

const crustTex = canvasTex(256,256,(g,w,h)=>{g.fillStyle='#C8BDA6';g.fillRect(0,0,w,h);
  for(let i=0;i&lt;2600;i++){g.fillStyle='rgba(245,240,228,'+(R()*.35)+')';g.fillRect(R()*w,R()*h,1+R()*2,1+R()*2)}
  g.strokeStyle='rgba(120,104,80,.55)';g.lineWidth=1.3;
  for(let i=0;i&lt;46;i++){let x=R()*w,y=R()*h;g.beginPath();g.moveTo(x,y);for(let k=0;k&lt;4;k++){x+=(R()-.5)*60;y+=(R()-.5)*60;g.lineTo(x,y)}g.stroke()}});
crustTex.wrapS=crustTex.wrapT=THREE.RepeatWrapping;
const trail = new THREE.Mesh(new THREE.PlaneGeometry(1,.4), std(0xffffff,{map:crustTex,roughness:.85,polygonOffset:true,polygonOffsetFactor:-3}));
trail.rotation.x=-Math.PI/2; trail.position.y=.003; trail.receiveShadow=true; scene.add(trail);
const trailStart=-.34; let trailEnd=trailStart;
const crustAnchor = new THREE.Object3D(); scene.add(crustAnchor);
function updateTrail(){
  const len=Math.max(.001,trailEnd-trailStart);
  trail.scale.x=len; trail.position.x=trailStart+len/2; trail.visible=len&gt;.01;
  crustTex.repeat.set(len/.6,1);
  crustAnchor.position.set(trailStart+len*.55,.02,.2);
}
const dropMat = new THREE.MeshStandardMaterial({color:0x9FD3CF,roughness:.1,metalness:0,transparent:true,opacity:.85});
const dropGeo = new THREE.SphereGeometry(.006,8,6);
const drops=[]; for(let i=0;i&lt;60;i++){const d=new THREE.Mesh(dropGeo,dropMat);d.visible=false;d.userData.v=0;scene.add(d);drops.push(d)}
let dropTimer=0, dropIdx=0;

const st = {phase:'out', t:0, x:1.8, v:0};
trailEnd = st.x - .34;
let playing = !reduceMotion, xray=false, exploded=false, ex=0, follow=false, prevX=st.x;
robot.position.x = st.x;
const statusEl=document.getElementById('status'), statusText=document.getElementById('statusText');
const PHASE_TXT={out:'Обработка участка',pause:'Обработка участка',back:'Возврат на док-станцию',dock:'Зарядка и дозаправка',stop:'Пауза'};
function setStatus(){statusText.textContent=playing?PHASE_TXT[st.phase]:PHASE_TXT.stop;statusEl.classList.toggle('charge',playing&amp;&amp;st.phase==='dock')}
setStatus();

const VIEWS = {
  overview:{follow:false,pos:[3.6,2.3,4.4],tgt:[1.2,.35,0]},
  side:{follow:true,pos:[.05,.5,2.05],tgt:[0,.22,0]},
  front:{follow:true,pos:[1.7,.62,.95],tgt:[.1,.25,0]},
  under:{follow:true,pos:[-1.35,.13,.42],tgt:[-.18,.09,0]},
  rear:{follow:true,pos:[-1.45,.7,1.15],tgt:[-.3,.22,0]},
  dock:{follow:false,pos:[1.3,1.7,3.2],tgt:[-.5,.55,0]}
};
let tween=null;
function viewEnd(v){const rx=v.follow?robot.position.x:0;return{pos:new THREE.Vector3(v.pos[0]+rx,v.pos[1],v.pos[2]),tgt:new THREE.Vector3(v.tgt[0]+rx,v.tgt[1],v.tgt[2])}}
function goView(name){
  const v=VIEWS[name]; follow=false;
  document.querySelectorAll('[data-view]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.view===name)));
  if(reduceMotion){const e=viewEnd(v);camera.position.copy(e.pos);controls.target.copy(e.tgt);follow=v.follow;return}
  tween={v:v,t:0,p0:camera.position.clone(),t0:controls.target.clone()};
}
function ease(t){return t&lt;.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2}

const anchors=[];
function anchor(id,parent,x,y,z){const o=new THREE.Object3D();o.position.set(x,y,z);parent.add(o);anchors.push({id:id,o:o})}
anchor('hull',hullG,-.12,.37,-.16);
anchor('tracks',parts.trackR,.18,.12,.08);
anchor('drip',dripG,-.12,.09,.21);
anchor('roller',rollerG,-.34,.05,.21);
anchor('tank',innerG,-.03,.33,0);
anchor('gps',topG,-.25,.41,0);
anchor('sensors',topG,-.37,.56,.13);
anchor('lidar',topG,.13,.43,0);
anchor('contacts',rearG,-.48,.2,.12);
anchors.push({id:'dock',o:(()=>{const o=new THREE.Object3D();o.position.set(-.8,.82,-.35);dockG.add(o);return o})()});
anchors.push({id:'solar',o:(()=>{const o=new THREE.Object3D();o.position.set(-.6,1.36,.55);dockG.add(o);return o})()});
anchors.push({id:'crust',o:crustAnchor});

const labelsEl=document.getElementById('labels'), listEl=document.getElementById('partList');
let selected=null;
anchors.forEach(a=>{
  const b=document.createElement('button'); b.className='hs'; b.type='button'; b.setAttribute('aria-pressed','false');
  b.innerHTML='<span class=&quot;dot&quot;></span><span class=&quot;txt&quot;>'+PARTS[a.id].name+'</span>';
  b.addEventListener('click',()=>select(a.id)); labelsEl.appendChild(b); a.el=b;
  const li=document.createElement('li'); const lb=document.createElement('button'); lb.type='button'; lb.setAttribute('aria-pressed','false');
  lb.innerHTML='<b></b>'+PARTS[a.id].name; lb.addEventListener('click',()=>select(a.id)); li.appendChild(lb); listEl.appendChild(li); a.li=lb;
});
const dEyebrow=document.getElementById('dEyebrow'),dTitle=document.getElementById('dTitle'),dText=document.getElementById('dText'),dTag=document.getElementById('dTag');
function select(id){
  selected=id; const p=PARTS[id];
  anchors.forEach(a=>{a.el.setAttribute('aria-pressed',String(a.id===id));a.li.setAttribute('aria-pressed',String(a.id===id))});
  dEyebrow.textContent='Узел'; dTitle.textContent=p.name; dText.textContent=p.text;
  if(p.tag){dTag.textContent=p.tag;dTag.hidden=false}else dTag.hidden=true;
  if(p.xray &amp;&amp; !xray) setXray(true);
  goView(p.view);
}
const v3=new THREE.Vector3();
function updateLabels(){
  const w=window.innerWidth,h=window.innerHeight;
  anchors.forEach(a=>{
    a.o.getWorldPosition(v3); v3.project(camera);
    if(v3.z&gt;1||v3.z&lt;-1||Math.abs(v3.x)&gt;1.1||Math.abs(v3.y)&gt;1.1){a.el.style.transform='translate(-9999px,0)';return}
    const x=(v3.x+1)/2*w, y=(1-v3.y)/2*h;
    a.el.style.transform='translate('+x.toFixed(1)+'px,'+(y-5).toFixed(1)+'px)';
  });
}

document.querySelectorAll('[data-view]').forEach(b=>b.addEventListener('click',()=>goView(b.dataset.view)));
const bPlay=document.getElementById('bPlay'),bXray=document.getElementById('bXray'),bExplode=document.getElementById('bExplode'),bLabels=document.getElementById('bLabels');
bPlay.setAttribute('aria-pressed',String(playing));
bPlay.addEventListener('click',()=>{playing=!playing;bPlay.setAttribute('aria-pressed',String(playing));setStatus()});
function setXray(on){xray=on;bXray.setAttribute('aria-pressed',String(on));M.shell.transparent=on;M.shell.opacity=on?.18:1;M.shell.depthWrite=!on;M.shell.needsUpdate=true;}
bXray.addEventListener('click',()=>setXray(!xray));
bExplode.addEventListener('click',()=>{exploded=!exploded;bExplode.setAttribute('aria-pressed',String(exploded))});
bLabels.addEventListener('click',()=>{const on=bLabels.getAttribute('aria-pressed')!=='true';bLabels.setAttribute('aria-pressed',String(on));document.body.classList.toggle('nolabels',!on)});
const panelEl=document.getElementById('panel'), tp=document.getElementById('togglePanel');
if(window.innerWidth&lt;=760) panelEl.classList.add('collapsed');
tp.addEventListener('click',()=>{const c=panelEl.classList.toggle('collapsed');tp.setAttribute('aria-expanded',String(!c));tp.textContent=c?'Все узлы и характеристики':'Свернуть';});
controls.addEventListener('start',()=>{if(tween){tween=null}});

const clock=new THREE.Clock();
const OUT_END=5.4, OUT_V=.42, BACK_V=.9;
const emitW=new THREE.Vector3();
function step(dt){
  anemo.rotation.y += dt*7;
  let dripping=false, charging=false;
  if(playing){
    if(st.phase==='out'){st.v=OUT_V;st.x+=st.v*dt;dripping=true;if(st.x&gt;=OUT_END){st.x=OUT_END;st.phase='pause';st.t=0;setStatus()}}
    else if(st.phase==='pause'){st.v=0;st.t+=dt;if(st.t&gt;1.2){st.phase='back';setStatus()}}
    else if(st.phase==='back'){st.v=-BACK_V;st.x+=st.v*dt;if(st.x&lt;=0){st.x=0;st.phase='dock';st.t=0;setStatus()}}
    else if(st.phase==='dock'){st.v=0;st.t+=dt;charging=true;if(st.t&gt;3.2){st.phase='out';setStatus()}}
  } else st.v=0;
  robot.position.x=st.x;
  if(st.phase==='out' &amp;&amp; playing) trailEnd=Math.max(trailEnd,st.x-.34);
  updateTrail();

  trackOffset+=st.v*dt; updateTracks();
  wheels.forEach(w=>{w.m.rotation.z-=st.v*dt/w.r});
  rollerSpin.rotation.z-=st.v*dt/.055;

  const pulse=.5+.5*Math.sin(clock.elapsedTime*4);
  const col=charging?0xE8833A:0x3FB5A8;
  M.status.color.setHex(col); M.status.emissive.setHex(col); M.status.emissiveIntensity=charging?.8+pulse*1.6:1.6;
  dockLight.emissiveIntensity=charging?.4+pulse*2:.15;
  dockScreen.emissiveIntensity=charging?.6+pulse*.8:.35;

  if(dripping &amp;&amp; ex&lt;.05){
    dropTimer+=dt;
    while(dropTimer&gt;.03){dropTimer-=.03;
      const e=emitters[(Math.random()*emitters.length)|0]; e.getWorldPosition(emitW);
      const d=drops[dropIdx++%drops.length]; d.position.copy(emitW); d.position.y-=.012; d.userData.v=0; d.visible=true;}
  }
  drops.forEach(d=>{if(!d.visible)return;d.userData.v+=3.5*dt;d.position.y-=d.userData.v*dt;if(d.position.y&lt;.004)d.visible=false});

  ex+=((exploded?1:0)-ex)*Math.min(1,dt*(reduceMotion?60:5));
  Object.keys(EX).forEach(k=>{const g=parts[k],o=EX[k],b=g.userData.base;g.position.set(b.x+o[0]*ex,b.y+o[1]*ex,b.z+o[2]*ex)});

  const dx=robot.position.x-prevX; prevX=robot.position.x;
  if(tween){
    tween.t=Math.min(1,tween.t+dt/.9); const k=ease(tween.t), e=viewEnd(tween.v);
    camera.position.lerpVectors(tween.p0,e.pos,k); controls.target.lerpVectors(tween.t0,e.tgt,k);
    if(tween.t&gt;=1){follow=tween.v.follow;tween=null}
  } else if(follow &amp;&amp; dx!==0){camera.position.x+=dx;controls.target.x+=dx}
  controls.update();
}
function frame(){
  const dt=Math.min(clock.getDelta(),.05);
  step(dt);
  renderer.render(scene,camera);
  updateLabels();
  requestAnimationFrame(frame);
}
updateTracks();
frame();

window.addEventListener('resize',()=>{camera.aspect=window.innerWidth/window.innerHeight;camera.updateProjectionMatrix();renderer.setSize(window.innerWidth,window.innerHeight)});
})();
</script>
